name: Publish ACT I Web checkpoint

on:
  push:
    branches:
      - codex/act1-web-stage-2026-07-22
    paths:
      - .checkpoint-source-url

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/act1-web-stage-2026-07-22

      - name: Download verified Godot artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(cat .checkpoint-source-url)"
          mkdir -p .checkpoint-stage/outer .checkpoint-stage/inner
          curl --fail --location --retry 3 "$SOURCE_URL" --output .checkpoint-stage/artifact.zip
          unzip -q .checkpoint-stage/artifact.zip -d .checkpoint-stage/outer
          NESTED_ZIP="$(find .checkpoint-stage/outer -maxdepth 1 -type f -name 'act1-web-*.zip' -print -quit)"
          test -n "$NESTED_ZIP"
          unzip -q "$NESTED_ZIP" -d .checkpoint-stage/inner

      - name: Verify checkpoint files
        shell: bash
        run: |
          set -euo pipefail
          test -s .checkpoint-stage/inner/web/index.html
          test -s .checkpoint-stage/inner/web/index.js
          test -s .checkpoint-stage/inner/web/index.pck
          test -s .checkpoint-stage/inner/web/index.wasm
          test -s .checkpoint-stage/inner/web/checkpoint.json
          ! grep -Eiq 'SCRIPT ERROR|PARSE ERROR|FAILED|EXCEPTION' .checkpoint-stage/outer/export.log

      - name: Stage isolated playable route
        shell: bash
        run: |
          set -euo pipefail
          TARGET="band-site/public/play/the-gilded-null-act1/checkpoints/act1-cp001"
          mkdir -p "$TARGET"
          cp -a .checkpoint-stage/inner/web/. "$TARGET/"
          rm -f .checkpoint-source-url
          rm -rf .checkpoint-stage

      - name: Commit generated checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KAMDRIDI Checkpoint Bot"
          git config user.email "checkpoint-bot@users.noreply.github.com"
          git add band-site/public/play/the-gilded-null-act1/checkpoints/act1-cp001 .checkpoint-source-url
          git commit -m "Stage ACT I Web checkpoint 001"
          git push origin HEAD:codex/act1-web-stage-2026-07-22
